name: Toolchain image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docker/toolchain.Dockerfile, dev, .github/workflows/toolchain.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/toolchain.Dockerfile
          push: true
          tags: ghcr.io/sean3z/crocket-toolchain:gcc-16.2
          labels: org.opencontainers.image.source=https://github.com/sean3z/crocket
